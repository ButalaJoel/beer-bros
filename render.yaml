services:
  - type: web
    name: beer-bros-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run server:build
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEON_DATABASE_URL
        sync: false

databases:
  - name: beer-bros-db
    plan: free
    region: oregon

